name: flon-history-tools

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flon_history}
      POSTGRES_USER: ${POSTGRES_USER:-flon_history}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - history-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 100m
        max-file: "5"

  fill-pg:
    image: ${HISTORY_TOOLS_IMAGE:-ghcr.io/fullon-labs/floncore/history-tools:0.8.1}
    build:
      context: .
      args:
        VERSION_STRING: ${HISTORY_TOOLS_VERSION:-0.8.1}
    restart: unless-stopped
    command: ["/usr/local/bin/start-fill-pg"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-flon_history}
      PGUSER: ${POSTGRES_USER:-flon_history}
      PGPASSWORD_FILE: /run/secrets/postgres_password
      PGCONNECT_TIMEOUT: "5"
      SHIP_ENDPOINT: ${SHIP_ENDPOINT:?set SHIP_ENDPOINT to the internal funod SHiP host and port}
      HISTORY_SCHEMA: ${HISTORY_SCHEMA:?set HISTORY_SCHEMA to a chain-specific PostgreSQL schema}
      FILL_MAX_MESSAGES_IN_FLIGHT: ${FILL_MAX_MESSAGES_IN_FLIGHT:-1024}
      FILL_ACK_BATCH_SIZE: ${FILL_ACK_BATCH_SIZE:-256}
      FILL_TRIM: ${FILL_TRIM:-false}
      HISTORY_STALE_SECONDS: ${HISTORY_STALE_SECONDS:-90}
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck-fill-pg"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      options:
        max-size: 100m
        max-file: "5"

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}

volumes:
  history-postgres-data:
